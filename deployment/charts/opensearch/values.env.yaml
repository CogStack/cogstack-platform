opensearch:
  replicas: ${OPENSEARCH_K3S_REPLICA_COUNT}
  protocol: http
  antiAffinity: hard
  nodeAffinity: ${OPENSEARCH_K3S_NODE_AFFINITY}
  # Each StatefulSet pod gets its own claim. An empty storageClass uses the cluster default.
  persistence:
    enabled: true
    size: "${OPENSEARCH_K3S_VOLUME_SIZE}"
    storageClass: "${OPENSEARCH_K3S_STORAGE_CLASS}"
  # Supply opensearch.yml with --set-file as shown in the README.
  extraEnvs:
    - name: DISABLE_INSTALL_DEMO_CONFIG
      value: "true"
    - name: plugins.security.ssl.http.enabled
      value: "false"
    - name: plugins.security.allow_default_init_securityindex
      value: "true"
  envFrom:
    - configMapRef:
        name: opensearch-env
        optional: true
  secretMounts:
    - name: node-tls
      secretName: opensearch-node-tls
      path: /usr/share/opensearch/config/tls
      defaultMode: 0440
  securityConfig:
    internalUsersSecret: opensearch-security-bootstrap
    rolesSecret: opensearch-security-bootstrap
    rolesMappingSecret: opensearch-security-bootstrap
    tenantsSecret: opensearch-security-bootstrap
  resources:
    requests:
      cpu: "${OPENSEARCH_DOCKER_CPU_MIN}"
      memory: "${OPENSEARCH_DOCKER_RAM}"
    limits:
      cpu: "${OPENSEARCH_DOCKER_CPU_MAX}"
      memory: "${OPENSEARCH_DOCKER_RAM}"
