replicaCount: 1

image:
  repository: cogstacksystems/nginx
  tag: "latest"
  pullPolicy: Always

nginx:
  internalPort: ${NIFI_INTERNAL_PORT_NGINX}

clusterDomain: cluster.local

nifi:
  host: ""
  port: 8080
opensearch:
  host: ""
  port: 9200
dashboards:
  host: ""
  port: 5601

tls:
  existingSecret: nginx-tls

service:
  type: LoadBalancer
  port: 443

resources:
  requests:
    cpu: ${NGINX_DOCKER_CPU_MIN}
    memory: 128M
  limits:
    cpu: ${NGINX_DOCKER_CPU_MAX}
    memory: ${NGINX_DOCKER_RAM}
