apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogstack-nginx

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: cogstack-nginx

  template:
    metadata:
      labels:
        app: cogstack-nginx
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: https
              containerPort: {{ .Values.nginx.internalPort }}

          envFrom:
            - configMapRef:
                name: nginx-env
                optional: true

          volumeMounts:
            - name: config
              mountPath: /etc/nginx/templates/nifi
              readOnly: true
            - name: tls
              mountPath: /certificates
              readOnly: true
            - name: nifi-auth
              mountPath: /etc/nginx/nifi-auth
              readOnly: true

          readinessProbe:
            tcpSocket:
              port: https

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: config
          configMap:
            name: cogstack-nginx-config
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        - name: nifi-auth
          secret:
            secretName: nifi-auth
            optional: true
            items:
              - key: htpasswd
                path: htpasswd
