replicaCount: 1

image:
  repository: cogstacksystems/nginx
  tag: "latest"
  pullPolicy: Always

nginx:
  internalPort: 8443

clusterDomain: cluster.local

nifi:
  host: ""
  port: 8080
opensearch:
  host: ""
  port: 9200
dashboards:
  host: ""
  port: 5601

tls:
  existingSecret: nginx-tls

service:
  type: LoadBalancer
  port: 443

resources:
  requests:
    cpu: 1
    memory: 128M
  limits:
    cpu: 1
    memory: 512M
