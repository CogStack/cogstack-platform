---
# Source: opensearch-dashboards/charts/opensearch-dashboards/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  labels:
    helm.sh/chart: opensearch-dashboards-3.9.0
    app.kubernetes.io/name: opensearch-dashboards
    app.kubernetes.io/instance: opensearch-dashboards
    app.kubernetes.io/version: "3.9.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch-dashboards
      app.kubernetes.io/instance: opensearch-dashboards
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch-dashboards
        app.kubernetes.io/instance: opensearch-dashboards
      annotations:
        configchecksum: d1e75995a830349bc408753a17b8c3f055dee6b5155c343b9e553965d3a9fde
    spec:
      securityContext:
        {}
      serviceAccountName: opensearch-dashboards-dashboards
      volumes:
        - name: config
          configMap:
            name: opensearch-dashboards-config
      containers:
      - name: dashboards
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
        image: "opensearchproject/opensearch-dashboards:3.9.0"
        imagePullPolicy: "IfNotPresent"
        readinessProbe:
          failureThreshold: 10
          initialDelaySeconds: 10
          periodSeconds: 20
          successThreshold: 1
          tcpSocket:
            port: 5601
          timeoutSeconds: 5
        livenessProbe:
          failureThreshold: 10
          initialDelaySeconds: 10
          periodSeconds: 20
          successThreshold: 1
          tcpSocket:
            port: 5601
          timeoutSeconds: 5
        startupProbe:
          failureThreshold: 20
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 5601
          timeoutSeconds: 5
        env:
        - name: OPENSEARCH_HOSTS
          value: "http://opensearch-cluster-master:9200"
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: OPENSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: dashboards-auth
              key: username
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dashboards-auth
              key: password
        - name: COOKIE_PASS
          valueFrom:
            secretKeyRef:
              name: dashboards-auth
              key: cookie
        ports:
        - containerPort: 5601
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
          - name: config
            mountPath: /usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
            subPath: opensearch_dashboards.yml
