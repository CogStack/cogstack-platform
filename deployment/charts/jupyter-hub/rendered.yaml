          "source": [
            "### 4.1) Index MedCAT entities into OpenSearch\n",
            "\n",
            "Here we take each MedCAT entity and store it in OpenSearch in the `discharge_annotations` index\n",
            "\n",
            "We prefix MedCAT fields with `nlp.` and add `meta.note_id` / `meta.subject_id` so each entity stays linked to its source note."
          ]
        },
        {
          "cell_type": "code",
          "execution_count": 72,
