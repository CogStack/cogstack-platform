                            "      \"context_center\": [],\n",
                            "      \"context_right\": []\n",
                            "    }\n",
                            "  }\n",
                            "]\n"
                        ]
                    }
                ],
                "source": [
                    "medcat_payload = {\"content\": {\"text\": sample_text}}\n",
                    "\n",
                    "medcat_result = requests.post(medcat_url, json=medcat_payload).json()\n",
                    "medcat_annotations = medcat_result.get(\"result\").get(\"annotations\")\n",
                    "\n",
                    "print(\"=== MedCAT: entities ===\")\n",
                    "print(json.dumps(medcat_annotations, indent=2))"
                ]
            },
            {
                "cell_type": "markdown",
                "id": "95a2f603-f107-4266-9bd8-ae64fd6e7692",
                "metadata": {},
                "source": [
                    "From the above results, we can see that the service has detected \"Kidney Failure\" in the text with a cui of \"1\".\n",
                    "\n",
                    "We can see the raw JSON response from medcat by printing it"
                ]
            },
            {
                "cell_type": "code",
                "execution_count": 7,
                "id": "aad682db-df27-4520-b18d-58007594053f",
                "metadata": {},
                "outputs": [
                    {
                        "name": "stdout",
