  ocr-service-tutorial.ipynb: |
    {
      "cells": [
        {
          "cell_type": "markdown",
          "id": "a1c4e8f2-1b3d-4c9a-9e2f-ocr-tutorial-intro",
          "metadata": {},
          "source": [
            "# OCR Service Tutorial\n",
            "\n",
            "This is a step-by-step walkthrough that shows how to call the CogStack OCR service over HTTP:\n",
            "OCR of scanned files, and text extraction from a Word document.\n",
            "\n",
            "OCR is optical character recognition. Use this when you have images or scanned in documents containing text. The OCR service is also able to work with machine readable documents that do not need OCR, like word documents or pdfs containing text. This tutorial will show how it can parse both in the same way.\n",
            "\n",
            "## Overview\n",
            "\n",
            "### Who is this tutorial for:\n",
            "This is for developers, data engineers, and analysts who want a quick, practical example of how\n",
            "to integrate OCR Service into a Python workflow (and later into a notebook-based analysis).\n",
            "\n",
            "### What will the tutorial do:\n",
            "1) Define sample files and the service URL.\n",
            "2) OCR a PNG of a scanned document, by calling the ocr-service API\n",
            "3) Extract text from a Word document\n",
            "4) OCR a scanned PDF\n",
            "\n",
            "### Prerequisites\n",
            "The best way to run this notebook interactively is to run the CogStack Community Edition with Helm. Look at https://docs.cogstack.org/ to get started."
          ]
        },
        {
          "cell_type": "markdown",
          "id": "b2d5f9a3-2c4e-4d0b-8f31-ocr-tutorial-init-md",
          "metadata": {},
          "source": [
            "## Initialisation: Define the inputs and services\n",
            "We pick three sample files and the HTTP endpoint we will call.\n",
            "\n",
            "The samples are a PNG of a scanned document, a Word document that already contains text, and a scanned PDF:\n",
            "- [pat_id_1.png](https://github.com/CogStack/cogstack-platform/blob/ocr-service-v1.1.3/apps/ocr-service/ocr_service/tests/resources/docs/generic/pat_id_1.png)\n",
            "- [pat_id_1.docx](https://github.com/CogStack/cogstack-platform/blob/ocr-service-v1.1.3/apps/ocr-service/ocr_service/tests/resources/docs/generic/pat_id_1.docx)\n",
            "- [pat_id_1.pdf](https://github.com/CogStack/cogstack-platform/blob/ocr-service-v1.1.3/apps/ocr-service/ocr_service/tests/resources/docs/generic/pat_id_1.pdf)\n",
            "\n",
            "For the service URL, if using the cogstack community edition helm chart, this should be setup for you automatically using kubernetes services and env vars. Otherwise change it accordingly."
          ]
        },
        {
          "cell_type": "code",
          "execution_count": null,
          "id": "c3e6a0b4-3d5f-4e1c-9a42-ocr-tutorial-init-code",
          "metadata": {},
          "outputs": [],
          "source": [
            "import json\n",
            "import os\n",
            "\n",
            "import requests\n",
            "\n",
            "ocr_base_url = os.getenv(\n",
            "    \"OCR_SERVICE_URL\", \"http://cogstack-ocr-service:8090\"\n",
            ").rstrip(\"/\")\n",
            "\n",
            "ocr_url = ocr_base_url + \"/api/process\"\n",
            "\n",
            "base_url = \"https://raw.githubusercontent.com/CogStack/cogstack-platform/ocr-service-v1.1.3/apps/ocr-service/ocr_service/tests/resources/docs\"\n",
            "os.makedirs(\"data/ocr-service-tutorial\", exist_ok=True)\n",
            "\n",
            "open(\"data/ocr-service-tutorial/pat_id_1.png\", \"wb\").write(requests.get(f\"{base_url}/generic/pat_id_1.png\").content)\n",
            "open(\"data/ocr-service-tutorial/pat_id_1.docx\", \"wb\").write(requests.get(f\"{base_url}/generic/pat_id_1.docx\").content)\n",
            "open(\"data/ocr-service-tutorial/pat_id_1.pdf\", \"wb\").write(requests.get(f\"{base_url}/generic/pat_id_1.pdf\").content)"
          ]
        },
        {
          "cell_type": "markdown",
          "id": "a7c0e4f8-7b93-4250-de86-ocr-tutorial-png-md",
          "metadata": {},
          "source": [
            "## OCR a scanned document\n",
            "We can now use ocr service to read text from an image of a page.\n",
            "\n",
            "We have a PNG file that represents a scanned document. It does not already contain text, so the service will need to OCR it."
          ]
        },
        {
          "cell_type": "markdown",
          "id": "b8d1f5a9-8c04-4361-ef97-ocr-tutorial-png-display",
          "metadata": {},
          "source": [
            "The scanned document is a PNG file, that looks like this:\n",
            "\n",
            "![Scanned document](https://raw.githubusercontent.com/CogStack/cogstack-platform/ocr-service-v1.1.3/apps/ocr-service/ocr_service/tests/resources/docs/generic/pat_id_1.png)"
          ]
        },
        {
          "cell_type": "markdown",
          "id": "c9e2a6b0-9d15-4472-fa08-ocr-tutorial-png-ocr-md",
          "metadata": {},
          "source": [
            "We will send this image to the ocr service and print the text it recovers."
          ]
        },
        {
          "cell_type": "code",
          "execution_count": null,
          "id": "d0f3b7c1-0e26-4583-ab19-ocr-tutorial-png-ocr-code",
          "metadata": {},
          "outputs": [],
          "source": [
            "with open(\"data/ocr-service-tutorial/pat_id_1.png\", \"rb\") as f:\n",
            "    png_result = requests.post(ocr_url, files={\"file\": (\"pat_id_1.png\", f)}).json()\n",
            "\n",
            "print(\"=== OCR Service: PNG ===\")\n",
            "print(png_result.get(\"result\").get(\"text\"))"
          ]
        },
        {
          "cell_type": "markdown",
          "id": "e1a4c8d2-1f37-4694-bc20-ocr-tutorial-png-commentary",
          "metadata": {},
          "source": [
            "From the above result, we can see that the service has recovered the clinical note from the scanned image. The wording can differ slightly, because the service is reading an image of the page.\n",
            "\n",
            "We can see the raw JSON response from ocr service by printing it"
          ]
        },
        {
          "cell_type": "code",
          "execution_count": null,
          "id": "f2b5d9e3-2a48-4705-cd31-ocr-tutorial-raw-json",
          "metadata": {},
          "outputs": [],
          "source": [
            "print(\"=== OCR Service: Raw results ===\")\n",
            "print(json.dumps(png_result, indent=2))"
          ]
        },
        {
          "cell_type": "markdown",
          "id": "d4f7b1c5-4e60-4f2d-ab53-ocr-tutorial-docx-md",
          "metadata": {},
          "source": [
            "## Extract text from a Word document\n",
            "We can also use ocr service to extract text from a Word file.\n",
            "\n",
            "This document already contains text, so the service can read it without OCR."
          ]
        },
        {
          "cell_type": "code",
          "execution_count": null,
          "id": "e5a8c2d6-5f71-403e-bc64-ocr-tutorial-docx-code",
          "metadata": {},
          "outputs": [],
          "source": [
            "with open(\"data/ocr-service-tutorial/pat_id_1.docx\", \"rb\") as f:\n",
            "    docx_result = requests.post(ocr_url, files={\"file\": (\"pat_id_1.docx\", f)}).json()\n",
            "\n",
            "print(\"=== OCR Service: Word document ===\")\n",
            "print(docx_result.get(\"result\").get(\"text\"))"
          ]
        },
        {
          "cell_type": "markdown",
          "id": "f6b9d3e7-6a82-414f-cd75-ocr-tutorial-docx-commentary",
          "metadata": {},
          "source": [
            "From the above result, we can see that the service has extracted the clinical note from the Word document."
          ]
        },
        {
          "cell_type": "markdown",
          "id": "a3c7e8f4-7b93-4250-de86-ocr-tutorial-pdf-md",
          "metadata": {},
          "source": [
            "## OCR a scanned PDF\n",
            "A scanned PDF is the same idea as the PNG: the pages are images, so the service uses OCR to recover the text."
          ]
        },
        {
          "cell_type": "code",
          "execution_count": null,
          "id": "b4d8f9a5-8c04-4361-ef97-ocr-tutorial-pdf-code",
          "metadata": {},
          "outputs": [],
          "source": [
            "with open(\"data/ocr-service-tutorial/pat_id_1.pdf\", \"rb\") as f:\n",
            "    pdf_result = requests.post(ocr_url, files={\"file\": (\"pat_id_1.pdf\", f)}).json()\n",
            "\n",
            "print(\"=== OCR Service: scanned PDF ===\")\n",
            "print(pdf_result.get(\"result\").get(\"text\"))"
          ]
        },
        {
          "cell_type": "markdown",
          "id": "c5e0a6b6-9d15-4472-fa08-ocr-tutorial-pdf-commentary",
          "metadata": {},
          "source": [
            "From the above result, we can see that the service has recovered text from the scanned PDF."
          ]
        },
        {
          "cell_type": "markdown",
          "id": "e1a4c8d2-1f37-4694-bc21-ocr-tutorial-summary",
          "metadata": {},
          "source": [
            "## Summary\n",
            "This is the end of this tutorial.\n",
            "\n",
            "We can see by calling the OCR service, we are able to extract text from images, Word files, and scanned PDFs just by calling one HTTP API.\n",
            "\n",
            "## What next?\n",
            "Take the extracted text and follow the MedCAT + OpenSearch end-to-end tutorial (`medcat-opensearch-e2e.ipynb`). That shows how to ingest the text into OpenSearch and run MedCAT on top."
          ]
        }
      ],
      "metadata": {
        "kernelspec": {
          "display_name": "Python 3 (ipykernel)",
          "language": "python",
          "name": "python3"
        },
