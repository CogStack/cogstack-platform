                            "=== MedCAT: entities ===\n",
                            "[\n",
                            "  {\n",
                            "    \"0\": {\n",
                            "      \"pretty_name\": \"Kidney Failure\",\n",
                            "      \"cui\": \"1\",\n",
                            "      \"type_ids\": [\n",
                            "        \"T047\"\n",
                            "      ],\n",
                            "      \"source_value\": \"Kidney Failure\",\n",
                            "      \"detected_name\": \"kidney~failure\",\n",
                            "      \"acc\": 1,\n",
                            "      \"context_similarity\": 1,\n",
                            "      \"start\": 24,\n",
