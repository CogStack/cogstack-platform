                    }
                ],
                "source": [
                    "print(\"=== MedCAT Service: Raw results ===\")\n",
                    "print(json.dumps(medcat_result, indent=2))"
                ]
            },
            {
                "cell_type": "markdown",
                "id": "c4a7dfdb-730f-4390-94eb-31055ecae914",
                "metadata": {},
                "source": [
                    "## Perform deidentificaition by using AnonCAT sercice\n",
                    "\n",
                    "We can also use AnonCat service to deidentify our notes.\n",
                    "\n",
                    "The process for this is the same as medcat, the only difference is we are will call a different endpoint. We will send `sample_text` to MedCAT’s `/api/process` route where the payload is shaped as: `{\"content\": {\"text\": sample_text}}`.\n",
                    "\n",
                    "We can then parse the JSON response and pull out the text which should be anonymised"
                ]
            },
            {
                "cell_type": "code",
                "execution_count": 14,
                "id": "e2e0cba5-3c08-4c1f-869f-f8012b0a9282",
                "metadata": {},
                "outputs": [
                    {
                        "name": "stdout",
                        "output_type": "stream",
                        "text": [
                            "=== AnonCAT: Deidentification result ===\n",
                            "The input was 'John was diagnosed with Kidney Failure'. The output was '[PATIENT] diagnosed with Kidney Failure'\n"
                        ]
                    }
                ],
                "source": [
                    "anoncat_payload = {\"content\": {\"text\": sample_text}}\n",
                    "anoncat_result = requests.post(anoncat_url, json=anoncat_payload).json()\n",
                    "\n",
                    "deidentified_text = anoncat_result.get(\"result\").get(\"text\")\n",
                    "\n",
                    "print(\"=== AnonCAT: Deidentification result ===\")\n",
                    "print(f\"The input was '{sample_text}'. The output was '{deidentified_text}'\")"
                ]
            },
            {
                "cell_type": "markdown",
                "id": "e4a9c7ce-4255-4ddc-a704-34663298a8a0",
                "metadata": {},
                "source": [
                    "From the above result, we can see that it has found that the note had the name \"John\", which it's replaced with the placeholder `[PATIENT]`. This has anonymised the note. Note we could alternatively change the service to redact the text, and return `[***]`, which we can do by configuring the service values and redeploying. \n",
                    "\n",
                    "We can see the raw JSON response from medcat by printing it. Note that it is the same format as medcat, just instead of finding medical concepts, it has found the patient name."
                ]
            },
            {
                "cell_type": "code",
                "execution_count": 13,
                "id": "e792e179-fc8a-4e76-aa19-efb0a3e01241",
                "metadata": {},
                "outputs": [
                    {
                        "name": "stdout",
                        "output_type": "stream",
                        "text": [
                            "=== AnonCAT: Deidentification result ===\n",
                            "{\n",
