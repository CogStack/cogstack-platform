# OpenSearch (single node): the Hibernate Search index next to PostgreSQL, which is
# what answers _text and _content. Hibernate Search reaches it through its
# Elasticsearch-compatible backend.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hapi-fhir-opensearch
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hapi-fhir-opensearch
spec:
  replicas: 1
  strategy:
    type: Recreate          # single RWO volume — never two pods at once
  selector:
    matchLabels:
      app: hapi-fhir-opensearch
  template:
    metadata:
      labels:
        app: hapi-fhir-opensearch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3.9.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # No authentication: reachable only inside the cluster (ClusterIP Service,
          # no Ingress or HTTPRoute). The security plugin is uninstalled before
          # OpenSearch starts, so there are no certificates, users or demo
          # configuration. The image's entrypoint then starts OpenSearch as usual.
          command:
            - bash
            - -ec
            - |
              bin/opensearch-plugin remove --purge opensearch-security
              exec ./opensearch-docker-entrypoint.sh
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: cluster.name
              value: hapi-fhir
            # The nodes keep the default vm.max_map_count, too low for mmap'd indices.
            - name: node.store.allow_mmap
              value: "false"
            # Deliberately small, with the limit below, for a cluster with little spare
            # memory.
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            limits:
              memory: 1200Mi
          startupProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=1s
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=1s
              port: http
            periodSeconds: 20
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hapi-fhir-opensearch
---
apiVersion: v1
kind: Service
metadata:
  name: hapi-fhir-opensearch
spec:
  selector:
    app: hapi-fhir-opensearch
  ports:
    - port: 9200
      targetPort: http
