nameOverride: ""
fullnameOverride: ""

replicaCount: 1
allowedNodes: ${NIFI_K3S_ALLOWED_NODES}

image:
  repository: cogstacksystems/nifi
  tag: "latest"
  pullPolicy: Always


podAnnotations: {}
podLabels: {}

securityContext:
  allowPrivilegeEscalation: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: ${NIFI_UID}
  runAsGroup: ${NIFI_GID}
  fsGroup: ${NIFI_GID}
  fsGroupChangePolicy: OnRootMismatch

nifi:
  internalPort: 8080

persistence:
  # null uses the cluster default; "" selects no StorageClass (pre-provisioned PVs).
  # Select a durable production backend; Retain does not replace backups.
  storageClassName: ${NIFI_K3S_STORAGE_CLASS_YAML}
  accessModes: [ReadWriteOnce]
  # Every volume is a separate PVC per replica. Each can override storageClassName/accessModes.
  # Existing data must be restored while NiFi is stopped; no automatic migration or resizing.
  # Claim templates are immutable on existing StatefulSets; plan replacement/expansion explicitly.
  volumes:
    flowfile_repository:
      size: "${NIFI_K3S_FLOWFILE_VOLUME_SIZE}"
    content_repository:
      size: "${NIFI_K3S_CONTENT_VOLUME_SIZE}"
    provenance_repository:
      size: "${NIFI_K3S_PROVENANCE_VOLUME_SIZE}"
    database_repository:
      size: "${NIFI_K3S_DATABASE_VOLUME_SIZE}"
    state:
      size: "${NIFI_K3S_STATE_VOLUME_SIZE}"
    conf:
      # Seeded only when empty; image upgrades never overwrite persisted configuration.
      # Existing PVCs without .nifi-bootstrap-complete require verification and explicit marking.
      size: "${NIFI_K3S_CONF_VOLUME_SIZE}"

resources:
  requests:
    cpu: "${NIFI_DOCKER_CPU_MIN}"
    memory: "${NIFI_DOCKER_RAM}"
  limits:
    cpu: "${NIFI_DOCKER_CPU_MAX}"
    memory: "${NIFI_DOCKER_RAM}"

terminationGracePeriodSeconds: 120
