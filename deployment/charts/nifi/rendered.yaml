---
# Source: nifi/templates/tls-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cogstack-nifi-tls-env
data:
  AUTH: tls
  NIFI_SECURITY_USER_AUTHORIZER: managed-authorizer
  NIFI_SECURITY_USER_LOGIN_IDENTITY_PROVIDER: single-user-provider
  NIFI_WEB_HTTPS_PORT: "8443"
  # Kubernetes uses /certificates; Compose retains /security/certificates.
  NIFI_KEYSTORE_PATH: /certificates/nifi/nifi-keystore.jks
  NIFI_TRUSTSTORE_PATH: /certificates/nifi/nifi-truststore.jks
  NIFI_HEALTHCHECK_CA_FILE: /certificates/root/root-ca.pem
  KEYSTORE_PATH: /certificates/nifi/nifi-keystore.jks
  TRUSTSTORE_PATH: /certificates/nifi/nifi-truststore.jks
  KEYSTORE_TYPE: JKS
  TRUSTSTORE_TYPE: JKS

---
# Source: nifi/templates/service.yaml
