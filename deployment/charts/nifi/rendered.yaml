---
# Source: nifi/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogstack-nifi
spec:
  podSelector:
    matchLabels:
      app: cogstack-nifi
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cogstack-nginx
      ports:
        - protocol: TCP
          port: 8080

---
# Source: nifi/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: cogstack-nifi-headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: cogstack-nifi
  ports:
    - name: http
      port: 8080

---
# Source: nifi/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: cogstack-nifi
spec:
  type: ClusterIP
  selector:
    app: cogstack-nifi
  ports:
    - name: http
      port: 8080
      targetPort: http

---
# Source: nifi/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cogstack-nifi

spec:
  serviceName: cogstack-nifi-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: cogstack-nifi
  template:
    metadata:
      labels:
        app: cogstack-nifi
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: initialize-conf
          image: "cogstacksystems/nifi:latest"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            limits:
              cpu: "1"
              memory: 2G
            requests:
              cpu: "1"
              memory: 2G
          command: ["/bin/sh", "-ec"]
          args:
            - |
              marker=/mnt/conf/.nifi-bootstrap-incomplete
              complete=/mnt/conf/.nifi-bootstrap-complete
              if [ -e "$marker" ]; then
                echo "Interrupted conf initialization; restore the conf PVC before starting NiFi." >&2
                exit 1
              fi
              test -w /mnt/conf || { echo "The conf PVC is not writable by the configured NiFi UID/GID." >&2; exit 1; }
              if [ ! -f "$complete" ]; then
                if [ -n "$(find /mnt/conf -mindepth 1 -maxdepth 1 ! -name lost+found -print -quit)" ]; then
                  echo "Unverified non-empty conf PVC; verify or restore its configuration before creating .nifi-bootstrap-complete." >&2
                  exit 1
                fi
                touch "$marker"
                sync -f /mnt/conf
                find "$NIFI_HOME/conf" -mindepth 1 -maxdepth 1 \
                  -exec cp -R --preserve=mode,timestamps -t /mnt/conf -- {} +
              fi
              for file in nifi.properties bootstrap.conf state-management.xml authorizers.xml login-identity-providers.xml logback.xml; do
                if [ ! -s "/mnt/conf/$file" ] || [ ! -r "/mnt/conf/$file" ] || [ ! -w "/mnt/conf/$file" ]; then
                  echo "Missing, empty or inaccessible NiFi configuration file: $file" >&2
                  exit 1
                fi
              done
              if [ -e "$marker" ]; then
                sync -f /mnt/conf
                mv "$marker" "$complete"
                sync -f /mnt/conf
              fi
          volumeMounts:
            - name: conf
              mountPath: /mnt/conf
      containers:
        - name: nifi
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: NIFI_SENSITIVE_PROPS_KEY
              valueFrom:
                secretKeyRef:
                  name: nifi-auth
                  key: NIFI_SENSITIVE_PROPS_KEY
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # The upstream container entrypoint always configures HTTPS.
              . /opt/nifi/scripts/common.sh
              prop_replace 'nifi.web.http.host' '0.0.0.0'
              prop_replace 'nifi.web.http.port' '8080'
              prop_replace 'nifi.remote.input.secure' 'false'
              prop_replace 'nifi.security.autoreload.enabled' 'false'
              sed -i -E \
                -e 's/^(nifi\.web\.https\.(host|port))=.*/\1=/' \
                -e 's/^(nifi\.security\.(keystore[^=]*|truststore[^=]*|keyPasswd))=.*/\1=/' \
                -e 's/^(nifi\.security\.user\.(authorizer|login\.identity\.provider))=.*/\1=/' "$nifi_props_file"
              prop_replace 'nifi.sensitive.props.key' "$NIFI_SENSITIVE_PROPS_KEY"
              uncomment 'nifi.python.command' "$nifi_props_file"
              prop_replace 'nifi.python.extensions.source.directory.default' "$NIFI_HOME/python_extensions"
              prop_replace 'nifi.nar.library.autoload.directory' "$NIFI_HOME/nar_extensions"
              exec "$NIFI_HOME/bin/nifi.sh" run

          volumeMounts:
            - name: flowfile-repository
              mountPath: /opt/nifi/nifi-current/flowfile_repository
            - name: content-repository
              mountPath: /opt/nifi/nifi-current/content_repository
            - name: provenance-repository
              mountPath: /opt/nifi/nifi-current/provenance_repository
            - name: database-repository
              mountPath: /opt/nifi/nifi-current/database_repository
            - name: state
              mountPath: /opt/nifi/nifi-current/state
            - name: conf
              mountPath: /opt/nifi/nifi-current/conf

          image: "cogstacksystems/nifi:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            exec: &healthcheck
              command: ["curl", "-fsS", "--noproxy", "*", "-o", "/dev/null", "http://127.0.0.1:8080/nifi-api/authentication/configuration"]
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec: *healthcheck
            timeoutSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 2G
            requests:
              cpu: "1"
              memory: 2G

  volumeClaimTemplates:
    - metadata:
        name: flowfile-repository
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: "20Gi"
    - metadata:
        name: content-repository
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: "100Gi"
    - metadata:
        name: provenance-repository
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: "50Gi"
    - metadata:
        name: database-repository
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: "5Gi"
    - metadata:
        name: state
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: "5Gi"
    - metadata:
        name: conf
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: "5Gi"
