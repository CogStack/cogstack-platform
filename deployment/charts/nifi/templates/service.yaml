apiVersion: v1
kind: Service
metadata:
  name: cogstack-nifi-headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: cogstack-nifi
  ports:
    - name: http
      port: {{ .Values.nifi.internalPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: cogstack-nifi
spec:
  type: ClusterIP
  selector:
    app: cogstack-nifi
  ports:
    - name: http
      port: {{ .Values.nifi.internalPort }}
      targetPort: http
