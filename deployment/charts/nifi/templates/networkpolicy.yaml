apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cogstack-nifi
spec:
  podSelector:
    matchLabels:
      app: cogstack-nifi
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cogstack-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.nifi.internalPort }}
