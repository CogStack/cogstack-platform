# Observability main stack. Prometheus and Grafana. 
# Depends on docker-compose.exporters.yml for the network
name: "cogstack-observability"
services:
  alloy:
    image: cogstacksystems/observability-alloy:latest
    restart: unless-stopped
    volumes:
      - ${BASE_DIR-.}/alloy/probers:/etc/alloy/probers
    networks:
      - observability
  prometheus:
    image: cogstacksystems/observability-prometheus:latest
    restart: unless-stopped
    volumes:
      - prometheus-data:/prometheus
    networks:
      - observability
  grafana:
    image: cogstacksystems/observability-grafana:latest
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - observability
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true # Allows use of grafana without sign in 
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
  nginx:
    image: cogstacksystems/nginx:latest
    environment:
      - NGINX_ENVSUBST_TEMPLATE_DIR=/etc/nginx/templates/observability
    networks:
     - observability
    restart: unless-stopped
    ports:
      - "80:8001"

networks:
  observability:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
