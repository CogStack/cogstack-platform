services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-pull
    entrypoint: >
      sh -c "
        until ollama list > /dev/null 2>&1; do
          echo '[ollama-pull] Waiting for Ollama...'; sleep 2;
        done &&
        ollama pull ${OLLAMA_MODEL:-llama3.2:3b}
      "
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    depends_on:
      - ollama
    restart: "no"

  medcat:
    image: cogstacksystems/medcat-service:latest
    container_name: cohorter-medcat
    environment:
      # Uses a preloaded model pack example inside the image
      # Can be substituted for a custom model
      - APP_MEDCAT_MODEL_PACK=/cat/models/examples/example-medcat-v2-model-pack.zip
      - APP_ENABLE_METRICS=True
    ports:
      - "5000:5000"
    restart: unless-stopped

  nl2dsl:
    build:
      context: ./NL2DSL
    container_name: cohorter-nl2dsl
    ports:
      - "3002:3002"
    environment:
      OLLAMA_URL: "http://ollama:11434/api/generate"
      OLLAMA_MODEL: "llama3.2:3b"
      MEDCAT_URL: "http://cohorter-medcat:5000"
      ALLOW_ORIGINS: "*"
    depends_on:
      - ollama-init
      - medcat
    restart: unless-stopped

  webapp:
    build:
      context: ./WebAPP
    container_name: cohorter-webapp
    ports:
      - "3000:3000"
    environment:
      NL2DSL_SERVER: "http://cohorter-nl2dsl:3002/api/compile"
      # Set to "true" to generate synthetic patient data on startup.
      RANDOM_DATA: "true"
    volumes:
      # Mount your data directory here. It should contain either:
      #   - snomed_terms_data.tar.gz (will be auto-extracted on startup), or
      #   - pre-extracted files: snomed_terms.json (SNOMED term lookup by Concept Unique Identifier) and cui_pt2ch.json (SNOMED CT ontology hierachy map).
      - ./WebAPP/server/data:/usr/src/app/server/data
    depends_on:
      - medcat
      - nl2dsl
    restart: unless-stopped

volumes:
  ollama:
