services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  medcat:
    image: cogstacksystems/medcat-service:latest
    container_name: cohorter-medcat
    environment:
      # Uses a preloaded model pack example inside the image
      # Can be substituted for a custom model
      - APP_MEDCAT_MODEL_PACK=/cat/models/examples/example-medcat-v2-model-pack.zip
      - APP_ENABLE_METRICS=True
    ports:
      - "5000:5000"
    restart: unless-stopped

  nl2dsl:
    build:
      context: ./NL2DSL
    container_name: cohorter-nl2dsl
    ports:
      - "3002:3002"
    environment:
      OLLAMA_URL: "http://ollama:11434/api/generate"
      OLLAMA_MODEL: "gpt-oss:20b"
      MEDCAT_URL: "http://cohorter-medcat:5000"
      ALLOW_ORIGINS: "*"
    depends_on:
      - ollama
      - medcat
    restart: unless-stopped

  webapp:
    build:
      context: ./WebAPP
      args:
        random: "false"   # set to "true" to run gen_random_data.js during build
    container_name: cohorter-webapp
    ports:
      - "3000:3000"
    environment:
      NL2DSL_URL: "http://cohorter-nl2dsl:3002"
    depends_on:
      - medcat
      - nl2dsl
    restart: unless-stopped

volumes:
  ollama:
