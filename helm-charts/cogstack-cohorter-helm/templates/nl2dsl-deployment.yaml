{{- if .Values.nl2dsl.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cogstack-cohorter-helm.fullname" . }}-nl2dsl
  labels:
    {{- include "cogstack-cohorter-helm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.nl2dsl.replicaCount }}
  selector:
    matchLabels:
      {{- include "cogstack-cohorter-helm.nl2dslSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cogstack-cohorter-helm.labels" . | nindent 8 }}
        app.kubernetes.io/component: nl2dsl
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cogstack-cohorter-helm.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nl2dsl
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.nl2dsl.image.repository }}:{{ .Values.nl2dsl.image.tag }}"
          imagePullPolicy: {{ .Values.nl2dsl.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.nl2dsl.service.port }}
              protocol: TCP
          env:
            - name: OLLAMA_URL
              value: "http://{{ include "cogstack-cohorter-helm.ollamaServiceName" . }}:{{ .Values.ollama.service.port }}/api/generate"
            - name: MEDCAT_URL
              value: "http://{{ include "cogstack-cohorter-helm.medcatServiceName" . }}:{{ .Values.medcat.service.port }}"
            {{- range $key, $value := .Values.nl2dsl.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.nl2dsl.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nl2dsl.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nl2dsl.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nl2dsl.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nl2dsl.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nl2dsl.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
