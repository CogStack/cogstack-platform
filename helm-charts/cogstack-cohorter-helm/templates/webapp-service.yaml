{{- if .Values.webapp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cogstack-cohorter-helm.fullname" . }}-webapp
  labels:
    {{- include "cogstack-cohorter-helm.webapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webapp.service.type }}
  ports:
    - port: {{ .Values.webapp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cogstack-cohorter-helm.webapp.selectorLabels" . | nindent 4 }}
{{- end }}
