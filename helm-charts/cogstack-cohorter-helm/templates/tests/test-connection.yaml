apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "cogstack-cohorter-helm.fullname" . }}-test-connection"
  labels:
    {{- include "cogstack-cohorter-helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "cogstack-cohorter-helm.fullname" . }}-webapp:{{ .Values.webapp.service.port }}']
  restartPolicy: Never