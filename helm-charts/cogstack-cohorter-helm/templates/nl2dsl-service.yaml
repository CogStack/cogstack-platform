{{- if .Values.nl2dsl.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cogstack-cohorter-helm.fullname" . }}-nl2dsl
  labels:
    {{- include "cogstack-cohorter-helm.nl2dsl.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nl2dsl.service.type }}
  ports:
    - port: {{ .Values.nl2dsl.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cogstack-cohorter-helm.nl2dsl.selectorLabels" . | nindent 4 }}
{{- end }}
