apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "medcat-service.fullname" . }}
  labels:
    {{- include "medcat-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "medcat-service.selectorLabels" . | nindent 6 }}
  strategy: {{ toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "medcat-service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "medcat-service.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
          {{- range $key, $value := .Values.envValueFrom }}
          - name: {{ $key | quote }}
            valueFrom:
              {{- tpl (toYaml $value) $ | nindent 14 }}
          {{- end }}
          {{- range $key, $value := .Values.env }}
          {{- if ne $key "APP_MEDCAT_MODEL_PACK" }}
          - name: "{{ tpl $key $ }}"
            value: "{{ tpl (print $value) $ }}"
          {{- end }}
          {{- end }}
          {{- if .Values.model.downloadUrl }}
          - name: "APP_MEDCAT_MODEL_PACK"
            value: '/models/{{ default "medcat-model.zip" .Values.model.name }}'
          {{ else }}
          - name: "APP_MEDCAT_MODEL_PACK"
            value: {{ .Values.env.APP_MEDCAT_MODEL_PACK | quote }}
          {{- end}}
          {{- if .Values.demoUi.footer.custom }}
          - name: APP_DEMO_UI_CUSTOM_MARKDOWN_PATH
            value: /config/demo-ui-footer.md
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.model.downloadUrl .Values.volumeMounts .Values.demoUi.footer.custom }}
          volumeMounts:
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}
            {{- if .Values.model.downloadUrl }}
            - name: models
              mountPath: /models
            {{- end }}
            {{- if .Values.demoUi.footer.custom }}
            - name: demoui-config
              mountPath: /config/demo-ui-footer.md
              subPath: {{ .Values.demoUi.footer.existingConfigMap.subPath | default "demo-ui-footer.md" }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.extraInitContainers .Values.model.downloadUrl }}
      initContainers:
      {{- end }}
      {{- if .Values.model.downloadUrl }}
        - name: model-downloader
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command: 
            - sh
            - -c
            - |
              set -e
              echo "Downloading model to $APP_MEDCAT_MODEL_PACK from $MODEL_PACK_URL"
              mkdir -p /models
              python - <<'PY'
              import os
              import requests

              url = os.environ["MODEL_PACK_URL"]
              path = os.environ.get("APP_MEDCAT_MODEL_PACK")

              r = requests.get(url, allow_redirects=True)
              r.raise_for_status()
              with open(path, "wb") as f:
                  f.write(r.content)
              PY
              echo "Download finished successfully"
          env:
          - name: MODEL_PACK_URL
            value: {{ .Values.model.downloadUrl}}
          - name: APP_MEDCAT_MODEL_PACK
            value: '/models/{{ default "medcat-model.zip" .Values.model.name }}'
          volumeMounts:
            - name: models
              mountPath: /models
      {{- end }}
      {{- $root := . -}}
      {{- with .Values.extraInitContainers }}
        {{- tpl (toYaml .) $root | nindent 8 }}
      {{- end }}
      {{- if or .Values.model.downloadUrl .Values.volumes .Values.demoUi.footer.custom }}
      volumes:
        {{- if .Values.volumes }}
        {{- toYaml .Values.volumes | nindent 8 }}
        {{- end }}
        {{- if .Values.model.downloadUrl }}
        - name: models
          emptyDir: {}
        {{- end }}
        {{- if .Values.demoUi.footer.custom }}
        - name: demoui-config
          configMap:
          {{- if .Values.demoUi.footer.existingConfigMap.name }}
            name: {{ .Values.demoUi.footer.existingConfigMap.name }}
          {{- else }}
            name: {{ include "medcat-service.fullname" . }}-demoui-config
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName | quote }}
      {{- end }}
