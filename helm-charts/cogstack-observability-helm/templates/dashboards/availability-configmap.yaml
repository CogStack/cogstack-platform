{{- if .Values.provisioning.dashboards.enabled }}
{{- if .Values.provisioning.dashboards.availability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cogstack-observability-helm.fullname" . }}-dashboards-availability
  labels:
    grafana_dashboard: "1"
data:
  cogstack-availability.json: |-
    {{ .Files.Get "dashboards/cogstack-availability.json" | nindent 4 }}
---
{{- end }}
{{- if .Values.provisioning.dashboards.fastapi.enabled }}
apiVersion: v1
kind: ConfigMap
