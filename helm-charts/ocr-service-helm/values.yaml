# Default values for medcat-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# -- This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  # -- Image repository for the MedCAT service container
  repository: cogstacksystems/cogstack-ocr-service
  # -- This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # tag: "latest"

tmp:
  enabled: true
  mountPath: /ocr_service/tmp
  emptyDir:
    medium: ""
    sizeLimit: 1Gi


env:
  OCR_SERVICE_HOST: "0.0.0.0"
  OCR_SERVICE_PORT: "8090"
  OCR_SERVICE_WORKER_CLASS: "sync"
  OCR_WEB_SERVICE_WORKERS: "1"
  OCR_SERVICE_LOG_LEVEL: "20"
  OCR_SERVICE_DEBUG_MODE: "false"
  OCR_SERVICE_OPERATION_MODE: "OCR"
  OCR_SERVICE_CPU_THREADS: "1"
  OCR_SERVICE_CONVERTER_THREADS: "1"
  OCR_SERVICE_TESSERACT_LANG: "eng"
  OCR_SERVICE_TESSERACT_TIMEOUT: "30"
  OCR_SERVICE_TESSERACT_NICE: "-18"
  OCR_SERVICE_TESSERACT_CUSTOM_CONFIG_FLAGS: ""
  OCR_SERVICE_IMAGE_DPI: "200"
  OCR_SERVICE_LIBRE_OFFICE_PROCESS_TIMEOUT: "20"
  OCR_SERVICE_GUNICORN_LOG_FILE_PATH: "-"
  OCR_SERVICE_GUNICORN_LOG_LEVEL: "info"
  OCR_SERVICE_GUNICORN_MAX_REQUESTS_JITTER: "5000"
  OCR_SERVICE_GUNICORN_MAX_REQUESTS: "50000"
  OCR_SERVICE_GUNICORN_TIMEOUT: "300"
  OCR_SERVICE_GUNICORN_GRACEFUL_TIMEOUT: "30"
  OCR_TMP_DIR: "/ocr_service/tmp"


# -- Allow setting env values from field/configmap/secret references. Defaults to include k8s details for observability.
envValueFrom:
  K8S_NODE_NAME:
    fieldRef:
      fieldPath: spec.nodeName
  K8S_POD_NAME:
    fieldRef:
      fieldPath: metadata.name
  K8S_POD_UID:
    fieldRef:
      fieldPath: metadata.uid
  K8S_POD_NAMESPACE:
    fieldRef:
      fieldPath: metadata.namespace

# -- This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# -- This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

updateStrategy:
  # -- Used for Kubernetes deployment .spec.strategy.type. Allowed values are "Recreate" or "RollingUpdate".
  type: RollingUpdate
  # RollingUpdate default options example
  # rollingUpdate:
  #   maxSurge: 25%
  #   maxUnavailable: 25%

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# -- This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL


# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # -- This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # -- This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8090


# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2


# -- Configure resources for the pod. More information can be found here: https://kubernetes.io/docs/concepts/containers/
# Recommendation for a default production model is { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: null <unset>, memory: 1Gi } }
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 2 # Note one general k8s recommendation is to leave CPU limit unset
  #   memory: 4Gi
  # requests:
  #   cpu: 1
  #   memory: 2Gi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  failureThreshold: 3
  periodSeconds: 30
  initialDelaySeconds: 30
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /api/ready
    port: http
  failureThreshold: 6
  periodSeconds: 10
  initialDelaySeconds: 20
  timeoutSeconds: 5
startupProbe:
  httpGet:
    path: /api/ready
    port: http
  failureThreshold: 90
  periodSeconds: 10
  initialDelaySeconds: 2
  timeoutSeconds: 5

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# -- Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# -- Runtime class name for the pod (e.g., "nvidia" for GPU workloads)
# More information: https://kubernetes.io/docs/concepts/containers/runtime-class/
runtimeClassName: ""

nodeSelector: {}

tolerations: []

affinity: {}

# -- Host aliases for the pod
hostAliases: []
  # - ip: "127.0.0.1"
  #   hostnames:
  #   - "foo.local"

# -- Additional init containers to run before the main container. Can be templated
extraInitContainers: []

# -- Additional manifests to deploy to kubernetes. Can be templated
extraManifests: []
