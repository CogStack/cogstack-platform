name: docker_smoke_opensearch

on:
  push:
    branches: ['**']
    paths: &paths
      - 'apps/opensearch/**'
      - 'apps/opensearch-dashboards/**'
      - 'deployment/Makefile'
      - 'deployment/scripts/security/**'
      - 'deployment/security/templates/**'
      - '.github/workflows/docker_smoke_opensearch.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SECURITY_DIR: ${{ github.workspace }}/deployment/security
      KIBANA_PASSWORD: kibanaserver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Start the default stack and log in
        shell: bash
        run: |
          password=$(openssl rand -hex 16)
          export ROOT_CERTIFICATE_KEYSTORE_PASSWORD="$password" OS_CERTIFICATE_PASSWORD="$password"
          make -C deployment certs-root certs-opensearch
          OPENSEARCH_DASHBOARDS_DNS_NAMES=localhost ./deployment/scripts/security/create_opensearch_client_admin_certs.sh --dashboards-only
          certs="$SECURITY_DIR/certificates/opensearch"
          sudo chown 1000:1000 "$certs"/{opensearch-shared.key,es_kibana_client.key}
          request=(curl -fsS --cacert "$SECURITY_DIR/certificates/root/root-ca.pem" \
            --retry 30 --retry-all-errors --retry-delay 3 --max-time 10)

          search() { docker compose -f apps/opensearch/docker/docker-compose.yml "$@"; }
          search up -d
          "${request[@]}" --cert "$certs/admin.crt" --key "$certs/admin.key.pem" \
            -o /dev/null https://localhost:9200/_cluster/health
          tar -C "$certs" -cf - admin.crt admin.key.pem | search exec -T opensearch tar -xf - -C /tmp
          search exec -T opensearch plugins/opensearch-security/tools/securityadmin.sh \
            -icl -cd config/opensearch-security -cacert config/tls/ca.crt \
            -cert /tmp/admin.crt -key /tmp/admin.key.pem

          docker compose -f apps/opensearch-dashboards/docker/docker-compose.yml up -d
          "${request[@]}" -H 'osd-xsrf: smoke' --json '{"username":"kibanaro","password":"kibanaro"}' \
            https://localhost:5601/auth/login | jq -e '.username == "kibanaro"'

      - name: Cleanup
        if: always()
        env:
          SMOKE_JOB_STATUS: ${{ job.status }}
        run: |
          for app in opensearch-dashboards opensearch; do
            compose=(docker compose -f "apps/$app/docker/docker-compose.yml")
            if [[ "$SMOKE_JOB_STATUS" == failure ]]; then
              "${compose[@]}" logs --tail 50 || true
            fi
            "${compose[@]}" down -v
          done
