name: docker_build_cohorter

on:
  push:
    branches: [main]
    tags:
      - "cohorter-v*.*.*" # e.g., cohorter-v1.2.3
    paths:
      - "apps/cohorter/**"
      - ".github/workflows/docker_build_cohorter.yml"
  pull_request:
    paths:
      - "apps/cohorter/**"
      - ".github/workflows/docker_build_cohorter.yml"

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]' && github.repository == 'CogStack/cogstack-platform'
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - name: nl2dsl
            context: apps/cohorter/NL2DSL
            dockerfile: apps/cohorter/NL2DSL/Dockerfile
            image: cogstacksystems/cohorter-nl2dsl

          - name: webapp
            context: apps/cohorter/WebAPP
            dockerfile: apps/cohorter/WebAPP/Dockerfile
            image: cogstacksystems/cohorter-webapp

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            # latest tag on the default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Include all default tags
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ matrix.image }}:buildcache,mode=max
          secrets: |
            "npm_token=${{ github.token }}"
