name: docker_build_ocr_service

on:
  push:
    branches: [main]
    tags: ['ocr-service-v*.*.*']
    paths:
      - "apps/ocr-service/**"
      - ".github/workflows/docker_build_ocr_service.yml"
      - ".github/workflows/test_ocr_service.yml"
      - ".github/workflows/docker_template_ocr_service.yml"
      - ".github/workflows/docker_smoke_ocr_service.yml"
  pull_request:
    paths:
      - "apps/ocr-service/**"
      - ".github/workflows/docker_build_ocr_service.yml"
      - ".github/workflows/test_ocr_service.yml"
      - ".github/workflows/docker_template_ocr_service.yml"
      - ".github/workflows/docker_smoke_ocr_service.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'ocr-service-v')
    uses: ./.github/workflows/docker_template_ocr_service.yml
    with:
      image: cogstacksystems/ocr-service
      context: apps/ocr-service
      dockerfile: apps/ocr-service/Dockerfile
      cache_scope: cogstack-ocr-service
    secrets: inherit
