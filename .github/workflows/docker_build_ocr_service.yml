name: docker_build_ocr_service

on:
  push:
    branches: [main]
    tags: ['ocr-service-v*.*.*']
    paths: &paths
      - "apps/ocr-service/**"
      - ".github/workflows/docker_build_ocr_service.yml"
      - ".github/workflows/test_ocr_service.yml"
      - ".github/workflows/docker_smoke_ocr_service.yml"
  pull_request:
    paths: *paths
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-cogstacksystems/ocr-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'ocr-service-v')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - {platform: amd64, runner: ubuntu-24.04}
          - {platform: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - &login
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: &image cogstacksystems/ocr-service
          flavor: |
            latest=false
            suffix=-${{ matrix.platform }},onlatest=true
          tags: &tags |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
            type=match,pattern=ocr-service-v(\d+\.\d+\.\d+),group=1
      - uses: docker/build-push-action@v7
        with:
          context: apps/ocr-service
          file: apps/ocr-service/Dockerfile
          platforms: linux/${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cogstack-ocr-service-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=cogstack-ocr-service-${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - *login
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: *image
          tags: *tags
          flavor: latest=false
      - name: Create multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r ref; do
            tag="${ref##*:}"
            [[ "$tag" == latest || "$tag" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || continue
            ref="${ref%:*}:${tag#v}"
            docker buildx imagetools create --tag "$ref" "$ref-amd64" "$ref-arm64"
          done <<< "$TAGS"
