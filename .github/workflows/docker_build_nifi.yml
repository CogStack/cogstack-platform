name: docker_build_nifi

on:
  push:
    branches: ['**']
    tags: ['nifi-v*.*.*']
    paths: &paths
      - 'apps/nifi/**'
      - '.github/workflows/docker_build_nifi.yml'
      - '!**/*.md'
      - '!**/README*'
  pull_request:
    paths: *paths
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-nifi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'nifi-v')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - &login
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: &image cogstacksystems/nifi
          flavor: suffix=-${{ matrix.arch }},onlatest=true
          tags: &tags |
            type=semver,pattern={{version}},match=^nifi-v(.*)$
            type=semver,pattern={{major}}.{{minor}},match=^nifi-v(.*)$
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/nifi-v') }}
            type=ref,event=branch,enable=${{ github.event_name != 'pull_request' }}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: apps/nifi
          file: apps/nifi/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nifi-${{ matrix.arch }}
          cache-to: type=gha,scope=nifi-${{ matrix.arch }},mode=max
          provenance: false

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - *login
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: *image
          tags: *tags
      - name: Publish multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            for attempt in {1..12}; do
              docker buildx imagetools create --tag "$tag" "$tag-amd64" "$tag-arm64" && break
              [ "$attempt" -lt 12 ] || exit 1
              sleep 5
            done
          done <<< "$TAGS"
