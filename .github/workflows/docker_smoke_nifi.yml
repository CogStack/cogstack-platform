name: docker_smoke_nifi

on:
  push:
    branches: ['**']
    paths: &paths
      - 'apps/nifi/**'
      - 'apps/nginx/**'
      - 'deployment/Makefile'
      - 'deployment/scripts/security/**'
      - 'deployment/security/templates/**'
      - '.github/workflows/docker_smoke_nifi.yml'
      - '!**/*.md'
      - '!**/README*'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: apps/nifi/docker

jobs:
  smoke:
    name: Smoke-test NiFi services
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: nifi-smoke
      SECURITY_DIR: ${{ github.workspace }}/deployment/security

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate smoke fixtures
        run: |
          password="$(openssl rand -hex 16)"
          ROOT_CERTIFICATE_KEYSTORE_PASSWORD="$password" KEYSTORE_PASSWORD="$password" TRUSTSTORE_PASSWORD="$password" \
            make -C ../../../deployment certs
          # The published containers run as UID/GID 1000.
          sudo chown 1000:1000 "$SECURITY_DIR"/certificates/{nifi/nifi-keystore.jks,nginx/tls.key}

          mkdir -p ../env
          touch ../env/general.env
          cat > ../env/nifi.env <<EOF
          NIFI_DOCKER_CPU_MIN=1
          NIFI_DOCKER_CPU_MAX=2
          NIFI_DOCKER_RAM=4g
          NIFI_HEALTHCHECK_HOST=nifi
          NIFI_WEB_PROXY_HOST=127.0.0.1:8443
          SINGLE_USER_CREDENTIALS_USERNAME=smoke
          SINGLE_USER_CREDENTIALS_PASSWORD=$password
          NIFI_SENSITIVE_PROPS_KEY=$(openssl rand -hex 16)
          KEYSTORE_PASSWORD=$password
          TRUSTSTORE_PASSWORD=$password
          EOF

      - name: Start NiFi and NGINX
        run: |
          source ./export_env_vars.sh
          docker compose up -d
          curl -fsS --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 300 --max-time 10 \
            --cacert "$SECURITY_DIR/certificates/root/root-ca.pem" -o /dev/null \
            https://127.0.0.1:8443/nifi-api/authentication/configuration

      - name: Dump container logs
        if: failure()
        run: |
          [[ -f ../env/nifi.env ]] || exit 0
          source ./export_env_vars.sh
          docker compose ps
          docker compose logs --no-color nifi nifi-nginx

      - name: Shutdown stack
        if: always()
        run: |
          [[ -f ../env/nifi.env ]] || exit 0
          source ./export_env_vars.sh
          docker compose down -v
