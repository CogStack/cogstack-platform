name: docker_build_nginx

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "apps/nginx/**"
      - ".github/workflows/docker_build_nginx.yml"
  pull_request:
    paths:
      - "apps/nginx/**"
      - ".github/workflows/docker_build_nginx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]' && github.repository == 'CogStack/cogstack-platform'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: cogstacksystems/nginx
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: apps/nginx
          file: apps/nginx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cogstack-nginx
          cache-to: type=gha,scope=cogstack-nginx,mode=max
