name: smoke-nifi-services

on:
  push:
    branches: ['**']
    paths: &paths
      - 'apps/nifi/**'
      - 'apps/nginx/**'
      - '.github/workflows/smoke_nifi_services.yml'
      - '!**/*.md'
      - '!**/README*'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: apps/nifi/docker

jobs:
  smoke:
    name: Build and smoke-test NiFi services
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_FILE: docker-compose.base.yml:docker-compose.dev.yml
      COMPOSE_PROJECT_NAME: nifi-smoke
      CERT_DIR: ../../../deployment/security/certificates

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate smoke fixtures
        run: |
          scratch_dir="$(mktemp -d)"
          trap 'rm -rf "$scratch_dir"' EXIT
          mkdir -p "$CERT_DIR"/{root,nifi,nginx} ../env
          ca_cert="$CERT_DIR/root/root-ca.pem"
          password="$(openssl rand -hex 16)"

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=NiFi smoke CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -keyout "$scratch_dir/ca.key" -out "$ca_cert"

          issue_cert() {
            local subject="$1" san="$2" key="$3" cert="$4"
            openssl req -new -newkey rsa:2048 -nodes -subj "/CN=$subject" \
              -keyout "$key" -out "$scratch_dir/leaf.csr"
            openssl x509 -req -days 1 -in "$scratch_dir/leaf.csr" \
              -CA "$ca_cert" -CAkey "$scratch_dir/ca.key" \
              -CAserial "$scratch_dir/ca.srl" -CAcreateserial \
              -extfile <(printf 'subjectAltName=%s\nextendedKeyUsage=serverAuth\n' "$san") -out "$cert"
          }
          issue_cert nifi DNS:nifi "$scratch_dir/nifi.key" "$scratch_dir/nifi.pem"
          issue_cert 127.0.0.1 IP:127.0.0.1 "$CERT_DIR/nginx/tls.key" "$CERT_DIR/nginx/tls.crt"

          openssl pkcs12 -export -name nifi -inkey "$scratch_dir/nifi.key" \
            -in "$scratch_dir/nifi.pem" -certfile "$ca_cert" \
            -out "$scratch_dir/nifi.p12" -passout "pass:$password"
          keytool -importkeystore -noprompt \
            -srckeystore "$scratch_dir/nifi.p12" -srcstoretype PKCS12 -srcstorepass "$password" \
            -destkeystore "$CERT_DIR/nifi/nifi-keystore.jks" -deststoretype JKS -deststorepass "$password"
          keytool -importcert -noprompt -alias root-ca -file "$ca_cert" \
            -keystore "$CERT_DIR/nifi/nifi-truststore.jks" -storetype JKS -storepass "$password"

          touch ../env/general.env
          cat > ../env/nifi.env <<EOF
          NIFI_DOCKER_CPU_MIN=1
          NIFI_DOCKER_CPU_MAX=2
          NIFI_DOCKER_RAM=4g
          NIFI_HEALTHCHECK_HOST=nifi
          NIFI_WEB_PROXY_HOST=127.0.0.1:8443
          SINGLE_USER_CREDENTIALS_USERNAME=smoke
          SINGLE_USER_CREDENTIALS_PASSWORD=$password
          NIFI_SENSITIVE_PROPS_KEY=$(openssl rand -hex 16)
          KEYSTORE_PATH=/security/certificates/nifi/nifi-keystore.jks
          KEYSTORE_TYPE=JKS
          KEYSTORE_PASSWORD=$password
          TRUSTSTORE_PATH=/security/certificates/nifi/nifi-truststore.jks
          TRUSTSTORE_TYPE=JKS
          TRUSTSTORE_PASSWORD=$password
          EOF

      - name: Validate published NGINX startup
        run: |
          source ./export_env_vars.sh
          # The runner owns the temporary NGINX key.
          docker compose -p nifi-smoke-published -f docker-compose.yml run --rm --no-deps \
            --user "$(id -u):$(id -g)" nifi-nginx nginx -t

      - name: Smoke tests
        run: |
          make start-nifi-dev-build
          source ./export_env_vars.sh
          url=https://127.0.0.1:8443
          request=(curl --silent --show-error --noproxy '*' --cacert "$CERT_DIR/root/root-ca.pem" --connect-timeout 5 --max-time 20)

          for route in / /nifi/; do
            code="$("${request[@]}" --fail --retry 30 --retry-all-errors --retry-delay 10 --retry-max-time 600 \
              --output /dev/null --write-out '%{http_code}' "$url$route")"
            case "$code" in
              200|301|302|303|307|308) echo "OK: $route returned HTTP $code" ;;
              *) echo "Unexpected HTTP $code from $route" >&2; exit 1 ;;
            esac
          done

          for service in nifi nifi-nginx; do
            docker compose exec -T "$service" sh -ec 'test "$(id -u)" -ne 0'
          done
          docker compose exec -T nifi /opt/nifi/scripts/cogstack-healthcheck.sh live
          docker compose exec -T nifi /opt/nifi/scripts/cogstack-healthcheck.sh ready
          for probe in live ready; do
            docker compose exec -T nifi-nginx curl -fsS --output /dev/null "http://127.0.0.1:8080/healthz/$probe"
          done

          response="$("${request[@]}" --data-urlencode "username=$SINGLE_USER_CREDENTIALS_USERNAME" \
            --data-urlencode "password=$SINGLE_USER_CREDENTIALS_PASSWORD" \
            --write-out $'\n%{http_code}' "$url/nifi-api/access/token")"
          code="${response##*$'\n'}"
          token="${response%$'\n'*}"
          if [[ "$code" != 201 || -z "$token" ]]; then
            echo "NiFi token request returned HTTP $code or an empty token" >&2
            exit 1
          fi

          code="$("${request[@]}" --header "Authorization: Bearer $token" --output /dev/null \
            --write-out '%{http_code}' "$url/nifi-api/flow/about")"
          if [[ "$code" != 200 ]]; then
            echo "Authenticated NiFi API returned HTTP $code" >&2
            exit 1
          fi
          echo 'OK: authenticated NiFi API returned HTTP 200'

      - name: Dump container logs
        if: failure()
        run: |
          [[ -f ../env/nifi.env ]] || exit 0
          source ./export_env_vars.sh
          docker compose ps
          docker compose logs --no-color nifi nifi-nginx

      - name: Shutdown stack
        if: always()
        run: |
          [[ -f ../env/nifi.env ]] || exit 0
          source ./export_env_vars.sh
          docker compose down -v
          docker compose -p nifi-smoke-published -f docker-compose.yml down
