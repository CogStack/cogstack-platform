name: kubernetes_smoke_logins

on:
  push:
    branches: ['**']
    paths: &paths
      - 'deployment/charts/nifi/**'
      - 'deployment/charts/nginx/**'
      - 'deployment/charts/opensearch/**'
      - 'deployment/charts/opensearch-dashboards/**'
      - 'deployment/Makefile'
      - 'deployment/env/authentication.env'
      - 'deployment/env/certificates.env'
      - 'deployment/env/general.env'
      - 'deployment/scripts/security/**'
      - 'deployment/security/templates/**'
      - 'apps/opensearch/**'
      - '.github/scripts/smoke_nifi_login.sh'
      - '.github/workflows/helm_smoke_logins.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call:
    inputs:
      stacks:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Kubernetes smoke (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(inputs.stacks || '["nifi","opensearch"]') }}
    env:
      SINGLE_USER_CREDENTIALS_USERNAME: smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: helm/kind-action@v1.15.2

      - name: Generate and load certificates
        run: |
          source deployment/env/general.env
          SECURITY_DIR=$(mktemp -d "$RUNNER_TEMP/k3s-smoke.XXXXXX")
          password=$(openssl rand -hex 16)
          printf '::add-mask::%s\n' "$password"
          printf 'SECURITY_DIR=%s\nSMOKE_PASSWORD=%s\n' "$SECURITY_DIR" "$password" >> "$GITHUB_ENV"
          export SECURITY_DIR ROOT_CERTIFICATE_KEYSTORE_PASSWORD="$password" OS_CERTIFICATE_PASSWORD="$password"
          export KEYSTORE_PASSWORD="$password" TRUSTSTORE_PASSWORD="$password"
          make -C deployment -j1 setup-k3s-namespace certs-all k3s-load-certs-all
          kubectl config set-context --current --namespace="$KUBE_NAMESPACE"

      - name: Install NiFi
        if: matrix.stack == 'nifi' || matrix.stack == 'nginx'
        run: |
          NIFI_SINGLE_USER_CREDENTIALS_USERNAME="$SINGLE_USER_CREDENTIALS_USERNAME" \
            NIFI_SINGLE_USER_CREDENTIALS_PASSWORD="$SMOKE_PASSWORD" \
            NIFI_SENSITIVE_PROPS_KEY="$(openssl rand -hex 16)" \
            KEYSTORE_PASSWORD="$SMOKE_PASSWORD" TRUSTSTORE_PASSWORD="$SMOKE_PASSWORD" \
            make -C deployment k3s-load-auth-nifi
          NIFI_WEB_PROXY_HOST=127.0.0.1:8443 make -C deployment k3s-install-nifi K3S_TIMEOUT=15m

      - name: NiFi login
        if: matrix.stack == 'nifi'
        run: |
          kubectl port-forward svc/cogstack-nifi 8443:8443 &
          trap 'kill "$!"' EXIT
          SINGLE_USER_CREDENTIALS_PASSWORD="$SMOKE_PASSWORD" bash .github/scripts/smoke_nifi_login.sh https://127.0.0.1:8443

      - name: NGINX proxy login
        if: matrix.stack == 'nifi' || matrix.stack == 'nginx'
        run: |
          make -C deployment k3s-install-nginx K3S_TIMEOUT=5m
          kubectl port-forward svc/cogstack-nginx 8443:8443 &
          trap 'kill "$!"' EXIT
          SINGLE_USER_CREDENTIALS_PASSWORD="$SMOKE_PASSWORD" bash .github/scripts/smoke_nifi_login.sh https://127.0.0.1:8443

      - name: OpenSearch authentication
        if: matrix.stack == 'opensearch'
        run: |
          sudo sysctl -w vm.max_map_count=262144
          OPENSEARCH_KIBANA_PASSWORD="$SMOKE_PASSWORD" make -C deployment k3s-load-auth-opensearch-dashboards
          make -C deployment k3s-install-opensearch
          OPENSEARCH_ANALYST_PASSWORD="$SMOKE_PASSWORD" \
            make -C deployment k3s-bootstrap-opensearch
          kubectl port-forward svc/opensearch-cluster-master 9200:9200 &
          trap 'kill "$!"' EXIT
          curl -fsS --noproxy '*' --cacert "$SECURITY_DIR/certificates/root/root-ca.pem" \
            --retry 10 --retry-all-errors --retry-delay 2 --max-time 10 \
            -u "cogstack_user:$SMOKE_PASSWORD" https://localhost:9200/_plugins/_security/authinfo |
            jq -e '.user_name == "cogstack_user"'

      - name: OpenSearch Dashboards login
        if: matrix.stack == 'opensearch'
        run: |
          certs="$SECURITY_DIR/certificates"
          make -C deployment k3s-load-certs-opensearch-dashboards
          make -C deployment k3s-install-opensearch-dashboards K3S_TIMEOUT=5m
          kubectl port-forward svc/opensearch-dashboards 5601:5601 &
          trap 'kill "$!"' EXIT
          curl -fsS --noproxy '*' --cacert "$certs/root/root-ca.pem" --max-time 10 \
            --retry 30 --retry-all-errors --retry-delay 3 -H 'osd-xsrf: smoke' \
            --json "{\"username\":\"cogstack_user\",\"password\":\"$SMOKE_PASSWORD\"}" \
            https://localhost:5601/auth/login | jq -e '.username == "cogstack_user"'

      - name: Show pod logs on failure
        if: failure()
        run: |
          kubectl get pods,svc,pvc
          for pod in $(kubectl get pods -o name); do
            kubectl logs "$pod" --all-containers --tail=100 || true
          done
