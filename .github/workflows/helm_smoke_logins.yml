name: helm_smoke_logins

on:
  push:
    branches: ['**']
    paths: &paths
      - 'deployment/charts/nifi/**'
      - 'deployment/charts/nginx/**'
      - 'deployment/charts/opensearch/**'
      - 'deployment/charts/opensearch-dashboards/**'
      - 'deployment/Makefile'
      - 'deployment/env/authentication.env'
      - 'deployment/env/certificates.env'
      - 'deployment/env/general.env'
      - 'deployment/scripts/security/**'
      - 'deployment/security/templates/**'
      - 'apps/opensearch/**'
      - '.github/workflows/helm_smoke_logins.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call:
    inputs:
      stacks:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Helm smoke (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(inputs.stacks || '["nifi","opensearch"]') }}
    env:
      SINGLE_USER_CREDENTIALS_USERNAME: smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: azure/setup-helm@v5.1.0
        with:
          version: v3.17.0
      - uses: helm/kind-action@v1.15.2

      - name: Generate and load certificates
        env:
          STACK: ${{ matrix.stack }}
        run: |
          command -v htpasswd >/dev/null || sudo apt-get install -y apache2-utils
          source deployment/env/general.env
          SECURITY_DIR=$(mktemp -d "$RUNNER_TEMP/helm-smoke.XXXXXX")
          password=$(openssl rand -hex 16)
          printf '::add-mask::%s\n' "$password"
          printf 'SECURITY_DIR=%s\nSMOKE_PASSWORD=%s\n' "$SECURITY_DIR" "$password" >> "$GITHUB_ENV"
          export SECURITY_DIR ROOT_CERTIFICATE_KEYSTORE_PASSWORD="$password" OS_CERTIFICATE_PASSWORD="$password"
          make -C deployment -j1 setup-k3s-namespace certs-root certs-nginx k3s-load-certs-nginx
          if [[ "$STACK" == opensearch ]]; then
            make -C deployment -j1 certs-opensearch-nodes k3s-load-certs-opensearch NODES=opensearch-shared
          fi
          kubectl config set-context --current --namespace="$KUBE_NAMESPACE"

      - name: Install NiFi
        if: matrix.stack == 'nifi' || matrix.stack == 'nginx'
        run: |
          NIFI_SINGLE_USER_CREDENTIALS_USERNAME="$SINGLE_USER_CREDENTIALS_USERNAME" \
            NIFI_SINGLE_USER_CREDENTIALS_PASSWORD="$SMOKE_PASSWORD" \
            NIFI_SENSITIVE_PROPS_KEY="$(openssl rand -hex 16)" \
            make -C deployment k3s-load-auth-nifi
          make -C deployment helm-install-nifi HELM_TIMEOUT=15m

      - name: Install OpenSearch and Dashboards
        if: matrix.stack == 'opensearch'
        run: |
          sudo sysctl -w vm.max_map_count=262144
          OPENSEARCH_KIBANA_PASSWORD="$SMOKE_PASSWORD" OPENSEARCH_ANALYST_PASSWORD="$SMOKE_PASSWORD" \
            make -C deployment helm-install-opensearch-stack

      - name: Install NGINX
        run: |
          make -C deployment helm-install-nginx HELM_VALUES=- HELM_TIMEOUT=5m <<'YAML'
          service:
            type: ClusterIP
          YAML

      - name: NGINX Helm proxy login
        if: matrix.stack == 'nifi' || matrix.stack == 'nginx'
        run: |
          kubectl port-forward svc/cogstack-nginx 8443:443 &
          trap 'kill "$!"' EXIT
          request=(curl -sS --noproxy '*' --cacert "$SECURITY_DIR/certificates/root/root-ca.pem"
            --retry 12 --retry-all-errors --retry-delay 2 --max-time 10)
          api=https://127.0.0.1:8443/nifi-api/flow/current-user
          [[ $("${request[@]}" -o /dev/null -w '%{http_code}' "$api") == 401 ]]
          "${request[@]}" -f -u "$SINGLE_USER_CREDENTIALS_USERNAME:$SMOKE_PASSWORD" "$api" |
            jq -e '.anonymous == true'

      - name: OpenSearch and Dashboards through NGINX
        if: matrix.stack == 'opensearch'
        run: |
          kubectl port-forward svc/cogstack-nginx 8443:443 &
          trap 'kill "$!"' EXIT
          request=(curl -sS --noproxy '*' --cacert "$SECURITY_DIR/certificates/root/root-ca.pem"
            --retry 30 --retry-all-errors --retry-delay 3 --max-time 10)
          "${request[@]}" -f -u "cogstack_user:$SMOKE_PASSWORD" \
            https://127.0.0.1:8443/opensearch/_plugins/_security/authinfo |
            jq -e '.user_name == "cogstack_user"'
          headers=$(mktemp)
          "${request[@]}" -f -D "$headers" -H 'osd-xsrf: smoke' \
            --json "{\"username\":\"cogstack_user\",\"password\":\"$SMOKE_PASSWORD\"}" \
            https://127.0.0.1:8443/dashboards/auth/login | jq -e '.username == "cogstack_user"'
          grep -qi '^set-cookie: .*; secure' "$headers"

      - name: Show pod logs on failure
        if: failure()
        run: |
          kubectl get pods,svc,pvc
          for pod in $(kubectl get pods -o name); do
            kubectl logs "$pod" --all-containers --tail=100 || true
          done
