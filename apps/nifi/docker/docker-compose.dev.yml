services:
  nifi:
    container_name: cogstack-nifi
    image: ${NIFI_LOCAL_DOCKER_IMAGE:-cogstacksystems/nifi:local}
    pull_policy: build
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NIFI_VERSION: ${NIFI_VERSION:-2.12.0}
        NIFI_BASE_IMAGE: # Use the Dockerfile default when unset.
        NIFI_UID: ${COGSTACK_LOCAL_UID:-1000}
        NIFI_GID: ${COGSTACK_LOCAL_GID:-1000}
    environment:
      NIFI_DATA_PATH: /data/
    volumes:
      - ${NIFI_DATA_PATH:-../data/}:/data/:rw
      - ../drivers:/opt/nifi/drivers:ro
      - ../user_scripts:/opt/nifi/user_scripts:rw
      - ../user_schemas:/opt/nifi/user_schemas:ro
      - ../user_python_extensions:/opt/nifi/nifi-current/python_extensions:rw
    ports:
      - "${NIFI_OUTPUT_PORT:-8082}:${NIFI_WEB_HTTPS_PORT:-${NIFI_INTERNAL_PORT:-8443}}"
      - "${NIFI_REMOTE_INPUT_SOCKET_PORT:-${NIFI_INPUT_SOCKET_PORT:-10000}}"

  nifi-nginx:
    container_name: cogstack-nifi-nginx
    image: cogstacksystems/nginx:local
    pull_policy: build
    build:
      context: ../../nginx
      dockerfile: Dockerfile
      args:
        NGINX_UID: ${COGSTACK_LOCAL_UID:-1000}
        NGINX_GID: ${COGSTACK_LOCAL_GID:-1000}

networks:
  cognet:
    name: nifi-dev-net
