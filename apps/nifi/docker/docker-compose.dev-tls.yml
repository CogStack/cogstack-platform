services:
  nifi:
    environment:
      NIFI_HEALTHCHECK_HOST: ${NIFI_HEALTHCHECK_HOST:-nifi}
    volumes:
      - ${SECURITY_DIR}/certificates/nifi:/security/certificates/nifi:ro
      - type: bind
        source: ${SECURITY_DIR}/certificates/root/root-ca.pem
        target: /security/certificates/root/root-ca.pem
        read_only: true
        bind:
          create_host_path: false

  nifi-nginx:
    volumes:
      - ${SECURITY_DIR}/certificates/nginx:/certificates/nginx:ro
      - type: bind
        source: ${SECURITY_DIR}/certificates/root/root-ca.pem
        target: /certificates/root/root-ca.pem
        read_only: true
        bind:
          create_host_path: false
